<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أجدا العقارية | نُعيد تعريف العقار… مشروعاً، وقيمة، وتجربة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#f6f8fa" />
    <script>
      (function() {
        try {
          localStorage.removeItem('ajda-theme');
          var saved = localStorage.getItem('ajda-theme-mode');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0d1620');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f6f8fa');
          }
          var savedLang = localStorage.getItem('ajda-lang');
          if (savedLang === 'en') {
            document.documentElement.setAttribute('lang', 'en');
            document.documentElement.setAttribute('dir', 'ltr');
            document.title = 'Ajda Real Estate | Redefining Real Estate… Project, Value, and Experience';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-neutral-text font-['Cairo',sans-serif] overflow-x-hidden antialiased selection:bg-accent selection:text-canvas">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
