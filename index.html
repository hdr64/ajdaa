<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أجدا العقارية | نُعيد تعريف العقار… مشروعاً، وقيمة، وتجربة</title>
    <meta name="description" content="أجدا العقارية: تطوير عقاري وإدارة مشاريع تجارية ومستودعات ومكاتب في المملكة العربية السعودية. Ajda Real Estate: commercial, warehouse and office projects in Saudi Arabia." />
    <meta property="og:site_name" content="أجدا العقارية" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <meta name="theme-color" content="#f6f8fa" />
    <script>
      (function() {
        try {
          localStorage.removeItem('ajda-theme');
          var saved = localStorage.getItem('ajda-theme-mode');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0d1620');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f6f8fa');
          }
          var savedLang = localStorage.getItem('ajda-lang');
          if (savedLang === 'en') {
            document.documentElement.setAttribute('lang', 'en');
            document.documentElement.setAttribute('dir', 'ltr');
            document.title = 'Ajda Real Estate | Redefining Real Estate… Project, Value, and Experience';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-neutral-text font-['Cairo',sans-serif] overflow-x-hidden antialiased selection:bg-accent selection:text-canvas">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
