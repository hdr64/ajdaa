services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: ajda_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ajda_dev
      POSTGRES_PASSWORD: ajda_dev_password_123
      POSTGRES_DB: ajda_realestate_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
