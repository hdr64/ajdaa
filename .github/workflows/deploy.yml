name: Deploy

# A push to deploy-test deploys the TEST instance automatically.
# This workflow has no production target at all: production is deployed by
# hand, with the runbook in deploy/README-deploy.md.
on:
  push:
    branches: [ deploy-test ]

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch name or commit SHA). Empty = the triggering ref.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Gate: nothing is deployed before the code lints, builds and passes the
  # server test suite.
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.context.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The gate must test exactly what is deployed: check out the ref
          # that the deploy job will send to the server (an empty input ref
          # means "the ref that triggered the run").
          ref: ${{ inputs.ref || github.sha }}
          # The full history is needed to resolve a manual ref to a commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Resolve deployment ref
        id: context
        env:
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_REF:-}" ]; then
            # Same character class the server-side deploy script accepts.
            if ! printf '%s' "$DISPATCH_REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::Invalid ref '${DISPATCH_REF}': only letters, digits, '.', '_', '/' and '-' are allowed"
              exit 1
            fi
          fi

          # The checkout step above already pinned the working tree to the ref
          # that is going to be deployed, so HEAD *is* the commit to deploy.
          # Resolving 'origin/<ref>' again here could only pick a different
          # (newer) commit than the one the gate just tested.
          sha="$(git rev-parse --verify "HEAD^{commit}")"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve the deployment context to a commit (got '${sha}')"
            exit 1
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Show what will be deployed
        env:
          SHA: ${{ steps.context.outputs.sha }}
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### Deploy to the test instance"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse --short "$SHA")\` $(git log -1 --format=%s "$SHA") |"
            echo "| Author | $(git log -1 --format=%an "$SHA") |"
            echo "| Triggered by | $ACTOR ($TRIGGER) |"
            echo "| Target | test instance only (ajda.weghetk.com) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deploying $SHA ($(git log -1 --format=%s "$SHA")) triggered by $ACTOR via $TRIGGER"
          echo "Files changed in this commit:"
          git show --stat --format= "$SHA" | tail -15

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Build server
        run: npm --prefix server run build

      - name: Test server
        run: npm --prefix server test -- --reporter=verbose

      - name: Gate summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "- Verify gate (lint, build, server build, server tests): **$RESULT**" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # The only environment: the TEST instance. There is no production target.
    environment:
      name: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Prepare SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add it to the 'test' environment (docs/github-actions-deploy.md)."
              exit 1
            fi
          done
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH key and known_hosts written (host key entries: $(grep -c . "$RUNNER_TEMP/ssh/known_hosts"))."

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -uo pipefail
          echo "Sending 'test ${SHA}' to the server's forced command (install, migrate, build, restart, health check)."
          started=$SECONDS

          # The server-side forced command ignores everything except the two
          # arguments: the target (always "test") and the full commit SHA.
          # stderr is merged so that server-side errors show up in this log.
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519"             -o IdentitiesOnly=yes             -o BatchMode=yes             -o StrictHostKeyChecking=yes             -o ConnectTimeout=20             -o ServerAliveInterval=30             -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"             "${SSH_USER}@${SSH_HOST}"             "test ${SHA}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          ssh_status=${PIPESTATUS[0]}
          echo
          echo "ssh exited with status ${ssh_status} after $((SECONDS - started)) s."

          # Without the forced command on the server, "test <sha>" is the shell
          # builtin: it exits 0 and deploys nothing. Only the deploy script's
          # own success line proves the deploy ran.
          if [ "$ssh_status" -ne 0 ] || ! grep -q "event=deploy.success" "$RUNNER_TEMP/deploy.log"; then
            echo "::error::Deploy failed (ssh status ${ssh_status}); the server did not report event=deploy.success."
            if ! grep -q "event=ssh.accept" "$RUNNER_TEMP/deploy.log"; then
              echo "::error::The forced command never ran: check authorized_keys and /srv/ajda/deploy/ssh-entry.sh (deploy/README-deploy.md 4.2)."
            fi
            grep -E "level=error" "$RUNNER_TEMP/deploy.log" | sed 's/^/::error::/' || true
            exit 1
          fi

      - name: Deploy summary
        if: always()
        env:
          SHA: ${{ needs.verify.outputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Server deploy of \`${SHA:0:8}\`: **$RESULT**"
            if [ -f "$RUNNER_TEMP/deploy.log" ]; then
              echo
              echo "Server events:"
              echo '```'
              grep -E "event=|level=error" "$RUNNER_TEMP/deploy.log" | cut -c1-220 || true
              echo '```'
            else
              echo
              echo "No server output was captured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
